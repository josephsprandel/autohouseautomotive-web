---
# cPanel Git Version Control deployment for autohouseautomotive.com (Chicago / Wood Dale).
# cPanel account: aachicago (home is /home2/aachicago, not /home).
# Deploy = cPanel → Git Version Control → Manage → "Update from Remote",
# then "Deploy HEAD Commit". Copies the site files into public_html.
#
# Copies and overwrites only — it never deletes. Removing a page or folder
# from the live site is still done by hand in File Manager.
#
# Deliberately NOT deployed (host-managed, or not part of the site):
# .htaccess, cgi-bin/, .well-known/ — host-managed
# m/ — docroot stub for m.autohouseautomotive.com (.htaccess only)
# ro/ — legacy; holds old customer/invoice report history. Never commit it.
# _img/, css/, graphics/ — 2017-2018 leftovers; nothing live references them
# schedule.php — live on the server but not in this repo yet (rewrite pending).
#   Add it to the cp line below once it's committed.
deployment:
  tasks:
    - export DEPLOYPATH=/home2/aachicago/public_html/
    - /bin/cp -f index.html google1a4d95233974d369.html $DEPLOYPATH
